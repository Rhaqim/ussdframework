[package]
name = "ussdframework"
version = "0.1.0"
edition = "2021"
authors = ["Rhaqim <anusiemj@gmail.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ussdframework"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "main"
path = "src/main.rs"

[build-dependencies]
# Required to execute shell commands during build
cargo-make = "0.37.24"

[dependencies]
# web framework
openssl = "0.10.78"
actix-files = "0.6.10"
actix-web = "4.13.0"
actix-multipart = "0.7.2"
futures-util = "0.3.32"
awc = { version = "3.8.2", features = [ "openssl" ] }

# helpers
chrono = { version = "0.4.44", features = ["serde"] }
config = "0.15.22"
lazy_static = "1.5.0"
regex = "1.5.4"
static_dir = "0.2.0"

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# async
tokio = { version = "1.0", features = ["full"] }

# feature dependencies
diesel = { version = "2.3.7", features = ["r2d2"] }
diesel_migrations = { version = "2.3.1" }
dotenv = { version = "0.15.0" }

[features]
default = ["db-sqlite"]
db-sqlite = ["diesel/sqlite"]
db-postgres = ["diesel/postgres"]
menubuilder = []
