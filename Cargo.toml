[package]
name = "ussdframework"
version = "0.1.0"
edition = "2021"
authors = ["Rhaqim <anusiemj@gmail.com>"]
description = "A Rust framework for building USSD applications"
license = "MIT"
repository = "https://github.com/Rhaqim/ussdframework"
keywords = ["ussd", "telecom", "fintech", "actix"]
categories = ["network-programming", "web-programming"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ussdframework"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "main"
path = "src/main.rs"

# These examples live in the examples/ sub-workspace (examples/Cargo.toml).
# They are listed here so `cargo run --example <name>` works from the root, but
# require the matching feature flags to be passed explicitly.
[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"
required-features = ["menubuilder"]

[[example]]
name = "standalone"
path = "examples/standalone.rs"

[build-dependencies]
# Required to execute shell commands during build
cargo-make = "0.37.24"

[dependencies]
# web framework
openssl = "0.10.82"
actix-files = "0.7.4"
actix-web = "4.19.0"
actix-multipart = "0.8.8"
futures-util = "0.3.34"
awc = { version = "3.11.0", features = [ "openssl" ] }

# helpers
chrono = { version = "0.4.45", features = ["serde"] }
config = "0.15.27"
lazy_static = "1.5.1"
regex = "1.13.1"
static_dir = "0.2.0"

# serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.35"

# async
tokio = { version = "1.54.1", features = ["full"] }

# feature dependencies
diesel = { version = "2.3.14", features = ["r2d2"] }
diesel_migrations = { version = "2.3.2" }
dotenv = { version = "0.15.0" }

# HTTP client for webhook function calls (polyglot support)
reqwest = { version = "0.13.5", features = ["blocking", "json"] }

[features]
default = ["db-sqlite"]
db-sqlite = ["diesel/sqlite"]
db-postgres = ["diesel/postgres"]
menubuilder = []
